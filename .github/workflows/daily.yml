# Daily run: crawl all sources, rank trends, make new ads + trend-specific videos, update the site.
# Pushing the results makes Vercel redeploy the site automatically.
#
# Needs repository secrets (Settings -> Secrets and variables -> Actions):
#   GEMINI_API_KEY, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN   (required)
#   YOUTUBE_API_KEY, REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET       (optional extra sources)
#   HF_TOKEN                                                      (optional: more free LTX-Video motion clips)
#
# Started at 07:00 IST by the site's Vercel cron (/api/cron/daily presses "Run workflow"), because GitHub's
# own schedule often starts hours late. The schedule below is only a backup: it does nothing if a full run
# already finished today.
name: Daily trend-to-ad run

on:
  schedule:
    - cron: "30 5 * * *"   # backup at 11:00 IST (GitHub may start it late); skipped if today's run is done
  workflow_dispatch:         # "Run workflow" button for a manual run
    inputs:
      max_ads:
        description: "Most new ads + trend videos to make (2 fit Cloudflare's free daily image allowance)"
        default: "2"

permissions:
  contents: write            # to push the new ads back to the repository

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # Runs fully only in a repository that has the API keys set; elsewhere it stops in seconds.
      - name: Check the API keys are set
        id: keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$GEMINI_API_KEY" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GEMINI_API_KEY / CLOUDFLARE_API_TOKEN secrets are not set in this repository; skipping the daily run."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.keys.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.keys.outputs.ok == 'true'
        run: |
          pip install -r requirements.txt -r requirements-video.txt
          python -m playwright install --with-deps chromium

      - name: Crawl, rank and make ads
        if: steps.keys.outputs.ok == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IMAGE_PROVIDER: cloudflare
          DAILY_MAX_ADS: ${{ github.event.inputs.max_ads || '2' }}
          DAILY_KEEP_DAYS: "7"
        run: python scripts/daily_run.py ${{ github.event_name == 'schedule' && '--if-not-ran-today' || '' }}

      - name: Publish to the site
        if: steps.keys.outputs.ok == 'true'
        run: |
          git config user.name "r2c-daily-run"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web_data static/daily static/showcase \
                  data/output/post_history.json data/output/ranked_trends.json \
                  data/output/dropped_trends.json data/output/autopilot_runs.jsonl
          if git diff --cached --quiet; then
            echo "Nothing new today."
            exit 0
          fi
          git commit -m "Daily run $(date -u +%Y-%m-%d): new trends and ads"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"   # picks up review decisions made meanwhile
          git push origin "HEAD:${GITHUB_REF_NAME}"
